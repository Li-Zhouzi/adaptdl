apiVersion: adaptdl.petuum.com/v1
kind: AdaptDLJob
metadata:
  generateName: imagenet-
spec:
  template:
    spec:
      containers:
      - name: main
        command:
        - python3
        - /root/imagenet/main.py
        - --arch=resnet50
        - --batch-size=200
        - --lr=0.08
        - --epochs=90
        - --autoscale-bsz
        - /mnt/imagenet
        env:
        - name: PYTHONUNBUFFERED
          value: "true"
        resources:
          limits:
            nvidia.com/gpu: 1
            cpu: 1
            memory: "12G"
          requests:
            nvidia.com/gpu: 1
            cpu: 1
            memory: "12G"
        volumeMounts:
        - name: pollux
          mountPath: /mnt
          readOnly: true
      imagePullSecrets:
      - name: regcred
