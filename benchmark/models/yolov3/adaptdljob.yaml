apiVersion: adaptdl.petuum.com/v1
kind: AdaptDLJob
metadata:
  generateName: yolov3-
spec:
  template:
    spec:
      containers:
      - name: main
        command:
        - python3
        - /root/yolov3/train.py
        - --weight_path=/mnt/VOC/darknet53_448.weights
        env:
        - name: PYTHONUNBUFFERED
          value: "true"
        resources:
          limits:
            nvidia.com/gpu: 1
            cpu: 1
            memory: "12G"
          requests:
            nvidia.com/gpu: 1
            cpu: 1
            memory: "12G"
        volumeMounts:
        - name: pollux
          mountPath: /mnt
          readOnly: true
      imagePullSecrets:
      - name: regcred
