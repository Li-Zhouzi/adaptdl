apiVersion: adaptdl.petuum.com/v1
kind: AdaptDLJob
metadata:
  generateName: cifar10-
spec:
  template:
    spec:
      containers:
      - name: main
        command:
        - /root/download_dataset.sh
        - cifar10
        - python3
        - /root/cifar10/main.py
        - --model=ResNet18
        env:
        - name: PYTHONUNBUFFERED
          value: "true"
        resources:
          limits:
            nvidia.com/gpu: 1
            cpu: 1 # Change here! original: 10
            memory: "10G" # Change here! original: 40G
          requests:
            nvidia.com/gpu: 1
            cpu: 1 # Change here! original: 10
            memory: "10G" # Change here! original: 40G
        volumeMounts:
        - name: data
          mountPath: /mnt
          readOnly: true
      volumes:
      - name: data
        hostPath:
          path: /
          type: Directory
      imagePullSecrets:
      - name: regcred
